name: CI
on: [push, pull_request]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Build (unsigned)
        run: xcodebuild -scheme QuitGuard -configuration Debug CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" build
      - name: Test
        run: xcodebuild -scheme QuitGuard -configuration Debug CODE_SIGNING_ALLOWED=NO test
